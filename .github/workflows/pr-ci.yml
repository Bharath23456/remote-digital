name: PR Validation (Docker Build & Test)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-docker-build-and-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker compose configuration schema is valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core Docker Services
        run: |
          echo "Building Docker images for backend, frontend, storage-gateway, and identity-service..."
          docker compose build backend frontend storage-gateway identity-service

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Build Verification
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DJANGO_API_URL: http://127.0.0.1:8000
          STORAGE_GATEWAY_URL: http://127.0.0.1:9000
          IDENTITY_SERVICE_URL: http://127.0.0.1:8100

      - name: Generate PR Validation Step Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🧪 Pull Request: Docker Build & Test Status

          ### 📋 Pull Request Information
          | Attribute | Details |
          |---|---|
          | **PR Number** | #${{ github.event.pull_request.number }} |
          | **PR Title** | ${{ github.event.pull_request.title }} |
          | **Author** | @${{ github.actor }} |
          | **Source Branch** | `${{ github.head_ref }}` |
          | **Target Branch** | `${{ github.base_ref }}` |
          | **Head Commit** | `${{ github.event.pull_request.head.sha }}` |

          ### ✅ Checks Performed
          - **Docker Compose Configuration**: Syntax & schema verified
          - **Docker Multi-Container Build**: Images built successfully
          - **Frontend Production Build**: Next.js 16 compiled without errors

          > 🎉 **Ready to merge:** All Docker build and test verifications have passed!
          EOF
