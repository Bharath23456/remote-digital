name: Fast Auto-Deploy & CI Pipeline

on:
  push:
    branches:
      - main

# Prevent queue delays: newer pushes automatically supersede older in-progress runs
concurrency:
  group: live-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. INSTANT LIVE SERVER DEPLOYMENT (Self-Hosted Runner)
  # Triggers immediately on push without waiting for cloud CI VMs!
  # =========================================================================
  deploy-live:
    name: Instant Live Server Deploy
    runs-on: self-hosted
    steps:
      - name: Execute Fast Zero-Lag Deployment
        shell: powershell
        run: |
          Write-Host "=========================================================="
          Write-Host "⚡ TRIGGERING INSTANT ZERO-LAG LIVE DEPLOYMENT"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Author: ${{ github.actor }}"
          Write-Host "=========================================================="

          # 1. Resolve project directory across different environments
          $candidatePaths = @(
              $env:DEPLOY_PATH,
              $env:GITHUB_WORKSPACE,
              "c:\Users\ASUS\remote-digital",
              "c:\Users\91895\Digital-Evaluation",
              "C:\digit\Digital-Evaluation",
              $PWD.Path
          )

          $deployDir = $null
          foreach ($p in $candidatePaths) {
              if ($p -and (Test-Path "$p\docker-compose.yml")) {
                  $deployDir = (Resolve-Path $p).Path
                  break
              }
          }

          if (-not $deployDir) {
              Write-Error "Deployment directory with docker-compose.yml not found."
              exit 1
          }

          Set-Location -Path $deployDir
          Write-Host "[DIR] Target Directory: $deployDir"

          # 2. Invoke optimized deploy script
          $scriptPath = Join-Path $deployDir "scripts\deploy_live.ps1"
          if (Test-Path $scriptPath) {
              & $scriptPath -TargetCommit "${{ github.sha }}" -BaseCommit "${{ github.event.before }}" -DeployPath $deployDir
          } else {
              # Fallback in case script was not synced yet
              git fetch origin main --quiet
              git reset --hard origin/main
              $env:DOCKER_BUILDKIT = "1"
              $env:COMPOSE_DOCKER_CLI_BUILD = "1"
              docker compose up -d
          }

      - name: Record Live Deployment Summary
        if: always()
        shell: powershell
        run: |
          if ($env:GITHUB_STEP_SUMMARY) {
              @"
          ### 🚀 Live Server Auto-Deployment
          - **Triggered By**: @${{ github.actor }}
          - **Commit**: [`${{ github.sha }}`](${{ github.event.head_commit.url }})
          - **Status**: Live stack synchronized with zero-lag delta updates
          - **Mode**: Smart delta rebuild (only affected services updated)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

  # =========================================================================
  # 2. PUSH NOTIFICATION & AUDIT (Runs in parallel with deployment)
  # =========================================================================
  notify-push:
    name: Push Event & Audit Details
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Display Push Info in Action Logs
        run: |
          echo "=========================================================="
          echo "🚀 NEW COMMIT PUSHED TO MAIN BRANCH"
          echo "=========================================================="
          echo "Pushed by   : ${{ github.actor }}"
          echo "Author      : ${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>"
          echo "Commit SHA  : ${{ github.sha }}"
          echo "Branch      : ${{ github.ref_name }}"
          echo "Commit Msg  : ${{ github.event.head_commit.message }}"
          echo "Timestamp   : ${{ github.event.head_commit.timestamp }}"
          echo "Commit URL  : ${{ github.event.head_commit.url }}"
          echo "=========================================================="
          echo "Changed files in this commit:"
          git diff-tree --no-commit-id --name-status -r ${{ github.sha }}
          echo "=========================================================="

      - name: Generate GitHub Actions Step Summary (UI Dashboard)
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 New Code Pushed to `main`

          ### 👤 Commit & Developer Details
          | Attribute | Details |
          |---|---|
          | **Developer** | **@${{ github.actor }}** |
          | **Author** | `${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>` |
          | **Commit Message** | `${{ github.event.head_commit.message }}` |
          | **Commit SHA** | [`${{ github.sha }}`](${{ github.event.head_commit.url }}) |
          | **Branch** | `${{ github.ref_name }}` |
          | **Pushed At** | `${{ github.event.head_commit.timestamp }}` |

          ### 📁 Files Changed in This Push
          ```text
          EOF
          git diff-tree --no-commit-id --name-status -r ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ```

          ---
          > 🔔 *Automated DevOps pipeline triggered by push to `main` branch.*
          EOF

  # =========================================================================
  # 3. FAST CI SANITY & BUILD VERIFICATION (Runs in parallel with deployment)
  # =========================================================================
  validate-build:
    name: Fast CI Sanity & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker compose configuration is valid."

      - name: Check Changed Files
        id: filter
        run: |
          if git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep -E '^frontend/'; then
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js 22 (Only if frontend changed)
        if: steps.filter.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js Build
        if: steps.filter.outputs.frontend_changed == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Frontend Build Verification
        if: steps.filter.outputs.frontend_changed == 'true'
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DJANGO_API_URL: http://127.0.0.1:8000
          STORAGE_GATEWAY_URL: http://127.0.0.1:9000
          IDENTITY_SERVICE_URL: http://127.0.0.1:8100

      - name: Update Step Summary with Build Status
        if: success()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### ✅ CI Sanity Verification
          - **Docker Compose**: Configuration valid
          - **Frontend Status**: Checked (incremental build cached)
          EOF
